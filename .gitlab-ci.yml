# ================================
# GITLAB CI/CD PIPELINE
# ================================
# Pipeline generated by zairakai/laravel-dev-tools.
# Inherits the full shared template — only project-specific variables
# are defined here.
#
# To update the template after a composer update:
#   composer update zairakai/laravel-dev-tools
#   (The ref: below is updated automatically)

include:
  - project: "zairakai/php-packages/laravel-dev-tools"
    ref: 3.0.1
    file: '.gitlab/ci/pipeline-php-package.yml'

variables:
  # Unique Composer cache key for this project
  CACHE_KEY: "laravel-activity"

  # Full package name on Packagist
  # Used in the GitLab release to link to the Packagist page
  PACKAGIST_PACKAGE: "zairakai/laravel-activity"

# The documentation site, published with GitLab Pages from main: main ("next") and every released version,
# each built from its own tag, with a version selector. See docs/scripts/publish.sh.
pages:
  stage: publish
  image: zairakai/node:latest-dev
  needs: []
  variables:
    GIT_DEPTH: 0
  before_script:
    - node --version
  script:
    - bash docs/scripts/publish.sh
  # The next jobs of the runner must not find (and lint) the docs dependencies.
  after_script:
    - rm -rf docs/node_modules docs/reference docs/guide docs/.vitepress/dist docs/.vitepress/cache
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
